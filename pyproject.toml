[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "obsidian-paper-tools"
version = "1.0.0"
description = "Obsidian Vault 学术论文管理工具集"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi",
    "pyyaml",
    "requests",
    "pdfplumber",
    "PyMuPDF",
]

[project.scripts]
vaultools = "cli:main"
